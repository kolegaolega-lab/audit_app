name: Audit regression tests

on:
  push:
    branches:
      - fix/fifo-shelf-life
  pull_request:
    branches:
      - fix/fifo-shelf-life

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run regression tests
        run: node --test tests/fifo.test.cjs tests/ocr-safety.test.cjs
