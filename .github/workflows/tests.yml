name: audit_app tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install chromium
      - run: npm run test:all
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test tests/browser/mobile-safari.spec.mjs --browser=webkit
      - run: npm run test:inventory
      - run: node --test tests/tools/function-inventory.mjs
